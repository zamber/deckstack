[package]
name = "ds-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "The deckstack MCP bridge: the daemon control API as MCP tools over stdio, JSON-RPC 2.0 (docs/components/mcp-bridge.md, DS-061)."

# Thin binary over ds-client/ds-ipc, like the ds CLI: every tool is one control-socket
# op; the bridge keeps no state of its own (only the deck_watch subscriptions).
[dependencies]
ds-client = { path = "../../crates/ds-client", version = "0.1.0" }
ds-ipc = { path = "../../crates/ds-ipc", version = "0.1.0" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ds-mcp"
path = "src/main.rs"

# Inherit the workspace lint config from the root Cargo.toml.
[lints]
workspace = true
