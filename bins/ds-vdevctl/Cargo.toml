[package]
name = "ds-vdevctl-bin"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Inspect and steer a running ds-vdev virtual MasterHub (DS-017)."

# Thin shell over the ds-vdev library's control-socket client; arg parsing is hand-rolled to
# keep the dependency set identical to the library's.
[dependencies]
ds-vdev = { path = "../../crates/ds-vdev" }
serde_json = "1"

[[bin]]
name = "ds-vdevctl"
path = "src/main.rs"

# Inherit the workspace lint config from the root Cargo.toml.
[lints]
workspace = true
