# deckstack repo boundaries (owner steering 2026-11-22, delta 8).
# The alpha core lives in this umbrella monorepo. The repos below are SEPARATE publish
# targets; none of them exists as a separate repo yet — "in-tree" means developed in this
# repo during alpha, "to create" means not started. Do not claim they exist.

[umbrella]
name = "deckstack"
path = "."                       # this repo: contracts (schemas/), Rust crates, ds CLI, ds-vdev, plugin host, conformance, docs
status = "alpha"
development = "in-tree"
publish = "git tag vX.Y.Z on main; CI builds artifacts"
owner = "steward"

[[repo]]
name = "deckstack-schemas"
path = "schemas/"
status = "alpha"
development = "in-tree (edited atomically with code)"
publish = "git subtree split --prefix=schemas --branch release/schemas && git push <remote> release/schemas:main"
owner = "steward"

[[repo]]
name = "deckstack-verify"
path = "tools/verify/ (to create in phase 2)"
status = "alpha (phase 2+)"
development = "in-tree during alpha, split out after Linux alpha is stable"
publish = "git subtree split --prefix=tools/verify --branch release/deckstack-verify"
owner = "steward"
description = "Camera/hardware verification harness — docs/90-verification.md"

[[repo]]
name = "deckstack-plugin-py"
path = "plugins-py/"
status = "alpha (phase 5)"
development = "in-tree during alpha; published separately as a PyPI package"
publish = "git subtree split --prefix=plugins-py --branch release/plugin-py; maturin/wheel to PyPI as ds-plugin-py"
owner = "steward"

[[repo]]
name = "deckstack-lights"
path = "integrations/lights/ (to create post-alpha)"
status = "post-alpha"
development = "to create — see docs/80-integrations.md; developed as its own repo from day one"
publish = "n/a until created"
owner = "steward"
description = "lights.lan integration as a deckstack plugin (separate process, manifest, host-mediated HTTP)"
